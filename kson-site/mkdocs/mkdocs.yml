site_name: KSON Documentation
site_url: https://kson.org/
site_description: KSON Documentation - A configuration language designed to be an improved interface on plain text data
site_author: KSON.org

# Directories
docs_dir: docs
site_dir: ../public/docs

# Use absolute URLs for assets
use_directory_urls: true

# Theme configuration
theme:
  name: material
  custom_dir: overrides
  logo: ../assets/images/kson_logo_blue.svg
  favicon: ../assets/images/kson_logo_blue.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - toc.follow
    - toc.integrate  # Integrate TOC into left navigation
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Extensions
markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - admonition
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

# Extra CSS
extra_css:
  - ../css/styles.css

# Navigation
nav:
  - Documentation:
      - Overview: index.md
      - Getting Started: install.md
      - Syntax & Grammar: syntax.md
      # Future docs pages can be added here:
      # - API Reference: api.md
      # - Examples: examples.md
  - Blog: blog/index.md

# Search
plugins:
  - search:
      lang: en
  - blog:
      blog_dir: blog
      authors: true
      authors_file: blog/.authors.yml
  - rss:
      match_path: blog/posts/.*

# Extra configuration  
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kson-org/kson
  generator: false  # Don't show "Made with Material for MkDocs"
  base_url: /docs/